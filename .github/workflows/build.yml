name: Build native library

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
          local-cache: false

      - name: Show NDK path
        run: echo "NDK path = ${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Check compiler
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ls -l "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -E "clang\+\+" || true
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            && echo "clang++ OK" || (echo "clang++ MISSING" && exit 1)

      - name: Configure
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S src/main/cpp -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build/${{ matrix.abi }} --config Release

      - name: Collect outputs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p out/${{ matrix.abi }}
          cp build/${{ matrix.abi }}/libkesho_cad.so out/${{ matrix.abi }}/

          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            TRIPLE=aarch64-linux-android
          else
            TRIPLE=arm-linux-androideabi
          fi

          NDK_LIB=$(find "$ANDROID_NDK_HOME" -name libc++_shared.so -path "*/$TRIPLE/*" | head -n 1)
          if [ -z "$NDK_LIB" ]; then
            echo "libc++_shared.so not found for $TRIPLE"
            exit 1
          fi
          cp "$NDK_LIB" out/${{ matrix.abi }}/
          ls -l out/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/
