name: Build OCCT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Get OCCT source
        run: git clone --depth 1 --branch V7_8_1 https://github.com/Open-Cascade-SAS/OCCT.git occt-src

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
          local-cache: false

      - name: Configure OCCT
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S occt-src -B occt-build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$PWD/occt-install/${{ matrix.abi }}" \
            -DBUILD_LIBRARY_TYPE=Shared \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_DataExchange=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON \
            -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_FoundationClasses=ON \
            -DUSE_TBB=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_FREEIMAGE=OFF \
            -DUSE_RAPIDJSON=OFF \
            -DUSE_VTK=OFF \
            -DINSTALL_TEST_CASES=OFF \
            -DBUILD_DOC_Overview=OFF

      - name: Build OCCT
        run: cmake --build occt-build/${{ matrix.abi }} --config Release --parallel 4

      - name: Install OCCT
        run: cmake --install occt-build/${{ matrix.abi }}

      - name: Collect outputs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p out/${{ matrix.abi }}
          cp occt-install/${{ matrix.abi }}/lib/*.so out/${{ matrix.abi }}/

          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            TRIPLE=aarch64-linux-android
          else
            TRIPLE=arm-linux-androideabi
          fi
          NDK_LIB=$(find "$ANDROID_NDK_HOME" -name libc++_shared.so -path "*/$TRIPLE/*" | head -n 1)
          cp "$NDK_LIB" out/${{ matrix.abi }}/

          echo "--- NEEDED of each lib ---"
          for f in out/${{ matrix.abi }}/*.so; do
            echo "== $f"
            readelf -d "$f" | grep NEEDED || true
          done
          ls -lh out/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: occt-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/
