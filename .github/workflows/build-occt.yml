name: Build OCCT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Get OCCT source
        run: git clone --depth 1 --branch V7_8_1 https://github.com/Open-Cascade-SAS/OCCT.git occt-src

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
          local-cache: false

      - name: Configure OCCT
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S occt-src -B occt-build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$PWD/occt-install/${{ matrix.abi }}" \
            -DBUILD_LIBRARY_TYPE=Shared \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_DataExchange=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON \
            -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_FoundationClasses=ON \
            -DUSE_TBB=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_FREEIMAGE=OFF \
            -DUSE_RAPIDJSON=OFF \
            -DUSE_VTK=OFF \
            -DINSTALL_TEST_CASES=OFF \
            -DBUILD_DOC_Overview=OFF

      - name: Build OCCT
        run: cmake --build occt-build/${{ matrix.abi }} --config Release --parallel 4

      - name: Install OCCT
        run: cmake --install occt-build/${{ matrix.abi }}

      - name: Collect outputs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          ABI=${{ matrix.abi }}
          LIBDIR="$PWD/occt-install/$ABI/lib"
          OUT="out/$ABI"
          mkdir -p "$OUT"

          if [ "$ABI" = "arm64-v8a" ]; then TRIPLE=aarch64-linux-android; else TRIPLE=arm-linux-androideabi; fi
          NDK_LIB=$(find "$ANDROID_NDK_HOME" -name libc++_shared.so -path "*/$TRIPLE/*" | head -n 1)
          cp "$NDK_LIB" "$OUT/"

          declare -A SEEN
          ORDER=()
          visit() {
            local lib="$1"
            if [ -n "${SEEN[$lib]:-}" ]; then return; fi
            SEEN[$lib]=1
            if [ ! -f "$LIBDIR/$lib" ]; then return; fi
            local dep
            for dep in $(readelf -d "$LIBDIR/$lib" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
              visit "$dep"
            done
            ORDER+=("$lib")
          }

          for seed in libTKDESTEP.so libTKDEIGES.so libTKMesh.so; do
            visit "$seed"
          done

          for lib in "${ORDER[@]}"; do
            cp "$LIBDIR/$lib" "$OUT/"
          done

          printf '%s\n' "${ORDER[@]}" > "$OUT/load_order.txt"

          {
            echo '        System.loadLibrary("c++_shared");'
            for lib in "${ORDER[@]}"; do
              n=${lib#lib}; n=${n%.so}
              echo "        System.loadLibrary(\"$n\");"
            done
          } > "$OUT/CadLoad.txt"

          echo "Libraries copied: ${#ORDER[@]}"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: occt-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/
